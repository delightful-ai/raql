[package]
name = "raql-host-ra"
version = "0.0.0"
edition = "2024"

[lib]
doctest = false

[dependencies]
raql-host = { path = "../raql-host" }
raql-ir = { path = "../raql-ir" }
raql-engine = { path = "../raql-engine" }

# rust-analyzer crates
ide.workspace = true
ide-db.workspace = true
hir.workspace = true
syntax.workspace = true
span.workspace = true
vfs.workspace = true
base-db.workspace = true
load-cargo.workspace = true
project-model.workspace = true

# utilities
line-index.workspace = true
rustc-hash.workspace = true
thiserror.workspace = true

[dev-dependencies]
raql-syntax = { path = "../raql-syntax" }
raql-compiler = { path = "../raql-compiler" }
camino.workspace = true
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
