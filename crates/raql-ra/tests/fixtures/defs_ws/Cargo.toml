[package]
name = "defs_ws"
version = "0.0.0"
edition = "2024"

[dependencies]
# A non-member path dependency. RA's local/library partition counts path
# deps as local, editable code — so scans DO enumerate it and its spans
# are in scope (pinned by slice_c_scans).
dep_lib = { path = "dep_lib" }

# Keep this fixture out of the enclosing raql workspace, and the
# dependency out of this one (non-member on purpose).
[workspace]
exclude = ["dep_lib"]
