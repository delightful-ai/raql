[package]
name = "raql"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "2"
members = [
  ".",
  "crates/raql-syntax",
  "crates/raql-compiler",
  "crates/raql-engine",
  "crates/raql-ir",
  "crates/raql-host",
  "crates/raql-host-ra",
]
default-members = [
  ".",
  "crates/raql-syntax",
  "crates/raql-compiler",
  "crates/raql-engine",
  "crates/raql-ir",
  "crates/raql-host",
  "crates/raql-host-ra",
]

[workspace.dependencies]
# crates.io utilities
camino                   = "1.2.1"
bitflags                 = "2.6.0"
chumsky                  = "0.9.3"
clap                     = { version = "4.5.18", features = ["derive"] }
fixedbitset              = "0.4.2"
indexmap                 = "2.5.0"
index_vec                = "0.1.3"
la-arena                 = "0.3.1"
logos                    = "0.14.1"
miette                   = { version = "7.2.0", features = ["fancy-no-backtrace"] }
petgraph                 = "0.6.5"
rustc-hash               = "1.1.0"
smallvec                 = "1.13.2"
smol_str                 = "0.3.2"
text-size                = "1.1.1"
thiserror                = "1.0.64"
line-index               = "0.1.2"

# rust-analyzer crates (published ra_ap_* family)
ide                      = { package = "ra_ap_ide", version = "0.0.319" }
hir                      = { package = "ra_ap_hir", version = "0.0.319" }
hir-def                  = { package = "ra_ap_hir_def", version = "0.0.319" }
hir-expand               = { package = "ra_ap_hir_expand", version = "0.0.319" }
hir-ty                   = { package = "ra_ap_hir_ty", version = "0.0.319" }
syntax                   = { package = "ra_ap_syntax", version = "0.0.319" }
span                     = { package = "ra_ap_span", version = "0.0.319" }
vfs                      = { package = "ra_ap_vfs", version = "0.0.319" }
paths                    = { package = "ra_ap_paths", version = "0.0.319" }
intern                   = { package = "ra_ap_intern", version = "0.0.319" }
base-db                  = { package = "ra_ap_base_db", version = "0.0.319" }

[dependencies]
clap.workspace = true
camino.workspace = true
miette.workspace = true

raql-syntax = { path = "crates/raql-syntax" }
raql-compiler = { path = "crates/raql-compiler" }
raql-engine = { path = "crates/raql-engine" }
raql-host = { path = "crates/raql-host" }
raql-host-ra = { path = "crates/raql-host-ra" }
