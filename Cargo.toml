[package]
name = "raql"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "2"
members = [
  ".",
  "crates/raql-syntax",
  "crates/raql-compiler",
  "crates/raql-engine",
  "crates/raql-ir",
  "crates/raql-host",
  "crates/raql-host-ra",
  "crates/raql-cli",
  "crates/raql-protocol",
  "crates/raql-daemon",
  "crates/raql-ra",
  "crates/raql-plan",
]
default-members = [
  ".",
  "crates/raql-syntax",
  "crates/raql-compiler",
  "crates/raql-engine",
  "crates/raql-ir",
  "crates/raql-host",
  "crates/raql-host-ra",
  "crates/raql-cli",
  "crates/raql-protocol",
  "crates/raql-daemon",
  "crates/raql-ra",
  "crates/raql-plan",
]

[workspace.dependencies]
# Must track the salsa version used by the pinned rust-analyzer rev (see vendor/rust-analyzer/Cargo.toml).
salsa                    = { version = "0.28.2", default-features = false, features = ["rayon", "salsa_unstable", "macros", "inventory"] }
camino                   = "1.2.1"
bitflags                 = "2.6.0"
chumsky                  = "0.9.3"
clap                     = { version = "4.5.18", features = ["derive"] }
fixedbitset              = "0.4.2"
indexmap                 = "2.5.0"
index_vec                = "0.1.3"
la-arena                 = "0.3.1"
logos                    = "0.14.1"
miette                   = { version = "7.2.0", features = ["fancy-no-backtrace"] }
petgraph                 = "0.6.5"
rustc-hash               = "1.1.0"
smallvec                 = "1.13.2"
smol_str                 = "0.3.2"
text-size                = "1.1.1"
thiserror                = "1.0.64"
line-index               = "0.1.2"
serde                    = { version = "1.0", features = ["derive"] }
serde_json               = "1.0"
crossbeam-channel        = "0.5"

ide                      = { package = "ide", git = "https://github.com/rust-lang/rust-analyzer", rev = "b2d445b22a2dd4c3469dfeddc2d5eb533c42baf6" }
ide-db                   = { package = "ide-db", git = "https://github.com/rust-lang/rust-analyzer", rev = "b2d445b22a2dd4c3469dfeddc2d5eb533c42baf6" }
hir                      = { package = "hir", git = "https://github.com/rust-lang/rust-analyzer", rev = "b2d445b22a2dd4c3469dfeddc2d5eb533c42baf6" }
syntax                   = { package = "syntax", git = "https://github.com/rust-lang/rust-analyzer", rev = "b2d445b22a2dd4c3469dfeddc2d5eb533c42baf6" }
span                     = { package = "span", git = "https://github.com/rust-lang/rust-analyzer", rev = "b2d445b22a2dd4c3469dfeddc2d5eb533c42baf6" }
vfs                      = { package = "vfs", git = "https://github.com/rust-lang/rust-analyzer", rev = "b2d445b22a2dd4c3469dfeddc2d5eb533c42baf6" }
base-db                  = { package = "base-db", git = "https://github.com/rust-lang/rust-analyzer", rev = "b2d445b22a2dd4c3469dfeddc2d5eb533c42baf6" }
load-cargo               = { package = "load-cargo", git = "https://github.com/rust-lang/rust-analyzer", rev = "b2d445b22a2dd4c3469dfeddc2d5eb533c42baf6" }
project-model            = { package = "project-model", git = "https://github.com/rust-lang/rust-analyzer", rev = "b2d445b22a2dd4c3469dfeddc2d5eb533c42baf6" }
vfs-notify               = { package = "vfs-notify", git = "https://github.com/rust-lang/rust-analyzer", rev = "b2d445b22a2dd4c3469dfeddc2d5eb533c42baf6" }

[dependencies]
raql-cli = { path = "crates/raql-cli" }
