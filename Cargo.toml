[package]
name = "raql"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "2"
members = [
  ".",
  "crates/raql-syntax",
  "crates/raql-compiler",
  "crates/raql-engine",
  "crates/raql-ir",
  "crates/raql-host",
  "crates/raql-host-ra",
]
default-members = [
  ".",
  "crates/raql-syntax",
  "crates/raql-compiler",
  "crates/raql-engine",
  "crates/raql-ir",
  "crates/raql-host",
  "crates/raql-host-ra",
]

[workspace.dependencies]
# crates.io utilities
camino                   = "1.2.1"
bitflags                 = "2.6.0"
chumsky                  = "0.9.3"
clap                     = { version = "4.5.18", features = ["derive"] }
fixedbitset              = "0.4.2"
indexmap                 = "2.5.0"
index_vec                = "0.1.3"
la-arena                 = "0.3.1"
logos                    = "0.14.1"
miette                   = { version = "7.2.0", features = ["fancy-no-backtrace"] }
petgraph                 = "0.6.5"
rustc-hash               = "1.1.0"
smallvec                 = "1.13.2"
smol_str                 = "0.3.2"
text-size                = "1.1.1"
thiserror                = "1.0.64"
line-index               = "0.1.2"

# rust-analyzer crates (upstream main workspace)
ide                      = { package = "ide", git = "https://github.com/rust-lang/rust-analyzer", rev = "adbff8baedae53f9955fe60c0d470ecd77b4f548" }
hir                      = { package = "hir", git = "https://github.com/rust-lang/rust-analyzer", rev = "adbff8baedae53f9955fe60c0d470ecd77b4f548" }
hir-def                  = { package = "hir-def", git = "https://github.com/rust-lang/rust-analyzer", rev = "adbff8baedae53f9955fe60c0d470ecd77b4f548" }
hir-expand               = { package = "hir-expand", git = "https://github.com/rust-lang/rust-analyzer", rev = "adbff8baedae53f9955fe60c0d470ecd77b4f548" }
hir-ty                   = { package = "hir-ty", git = "https://github.com/rust-lang/rust-analyzer", rev = "adbff8baedae53f9955fe60c0d470ecd77b4f548" }
syntax                   = { package = "syntax", git = "https://github.com/rust-lang/rust-analyzer", rev = "adbff8baedae53f9955fe60c0d470ecd77b4f548" }
span                     = { package = "span", git = "https://github.com/rust-lang/rust-analyzer", rev = "adbff8baedae53f9955fe60c0d470ecd77b4f548" }
vfs                      = { package = "vfs", git = "https://github.com/rust-lang/rust-analyzer", rev = "adbff8baedae53f9955fe60c0d470ecd77b4f548" }
paths                    = { package = "paths", git = "https://github.com/rust-lang/rust-analyzer", rev = "adbff8baedae53f9955fe60c0d470ecd77b4f548" }
intern                   = { package = "intern", git = "https://github.com/rust-lang/rust-analyzer", rev = "adbff8baedae53f9955fe60c0d470ecd77b4f548" }
base-db                  = { package = "base-db", git = "https://github.com/rust-lang/rust-analyzer", rev = "adbff8baedae53f9955fe60c0d470ecd77b4f548" }
load-cargo               = { package = "load-cargo", git = "https://github.com/rust-lang/rust-analyzer", rev = "adbff8baedae53f9955fe60c0d470ecd77b4f548" }
project-model            = { package = "project-model", git = "https://github.com/rust-lang/rust-analyzer", rev = "adbff8baedae53f9955fe60c0d470ecd77b4f548" }

[dependencies]
clap.workspace = true
camino.workspace = true
miette.workspace = true

raql-syntax = { path = "crates/raql-syntax" }
raql-compiler = { path = "crates/raql-compiler" }
raql-engine = { path = "crates/raql-engine" }
raql-host = { path = "crates/raql-host" }
raql-host-ra = { path = "crates/raql-host-ra" }
